<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Opening</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#050816;
color:white;
position:relative;
}
video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
opacity:.25;
}
.overlay{
position:fixed;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(5,8,22,.9));
backdrop-filter:blur(3px);
}
.card{
position:relative;
z-index:2;
width:min(92%,650px);
padding:50px 30px;
text-align:center;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.05);
border-radius:30px;
backdrop-filter:blur(14px);
box-shadow:0 0 50px rgba(0,255,255,.15);
animation:fadeIn 1s ease;
}
@keyframes fadeIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.badge{
display:inline-block;
padding:8px 18px;
border-radius:999px;
background:rgba(0,255,255,.15);
color:#7ef9ff;
margin-bottom:20px;
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;
}
h1{
font-size:clamp(2rem,5vw,4rem);
margin-bottom:15px;
}
p{
opacity:.8;
margin-bottom:35px;
line-height:1.6;
}
.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:35px;
}
.box{
padding:20px 10px;
background:rgba(255,255,255,.06);
border-radius:22px;
border:1px solid rgba(255,255,255,.1);
}
.box span{
display:block;
font-size:clamp(1.8rem,4vw,3rem);
font-weight:bold;
color:#7ef9ff;
}
.box small{
opacity:.7;
letter-spacing:1px;
}
.enter-btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:15px 35px;
border-radius:999px;
text-decoration:none;
color:#050816;
background:#7ef9ff;
font-weight:bold;
transition:.3s;
}
.enter-btn:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(126,249,255,.5)}
.note{margin-top:18px;font-size:13px;opacity:.5}
@media(max-width:600px){
.countdown{grid-template-columns:repeat(2,1fr)}
.card{padding:35px 20px}
}
</style>
</head>
<body>
<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-stars-in-space-1560086280540?download=1080p" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="card">
<div class="badge">COMING SOON</div>
<h1>Website Sắp ra mắt</h1>
<p>Hãy chờ đợi nha 😘</p>

<div class="countdown">
<div class="box"><span id="days">00</span><small>Ngày</small></div>
<div class="box"><span id="hours">00</span><small>Giờ</small></div>
<div class="box"><span id="minutes">00</span><small>Phút</small></div>
<div class="box"><span id="seconds">00</span><small>Giây</small></div>
</div>



<script>
const targetDate = new Date("2026-05-23T10:00:00").getTime();
const enterBtn = document.getElementById('enterBtn');

function updateCountdown(){
const now = new Date().getTime();
const distance = targetDate - now;

if(distance <= 0){
window.location.href = "HomerSL2.html";
return;
}

const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById('days').innerText = String(days).padStart(2,'0');
document.getElementById('hours').innerText = String(hours).padStart(2,'0');
document.getElementById('minutes').innerText = String(minutes).padStart(2,'0');
document.getElementById('seconds').innerText = String(seconds).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
